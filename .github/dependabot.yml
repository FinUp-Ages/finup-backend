version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Um PR por semana com todo o ecossistema Spring junto — as versoes sao alinhadas
      # pelo starter-parent, atualizar em separado quebra o alinhamento.
      spring:
        patterns:
          - "org.springframework*"
          - "org.springdoc*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
