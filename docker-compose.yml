services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - finup_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  app:
    build: .

    environment:
      # Porta interna fixa: o Dockerfile expoe 8080 e o mapeamento abaixo aponta para ela. O
      # SERVER_PORT do .env so escolhe a porta publicada no host; repassar o valor para dentro
      # faria o Tomcat escutar em outra porta e o mapeamento encaminharia para o vazio.
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      LOG_LEVEL: ${LOG_LEVEL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      # Dentro da rede do compose o Postgres e o servico "db", nao localhost.
      DB_HOST: db

    ports:
      - "${SERVER_PORT}:8080"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

volumes:
  finup_postgres_data: